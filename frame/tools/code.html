<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <link rel="icon" href="../image/super_train.png" type="image/png">
        <link rel="stylesheet" href="../style.css">
        <link rel="stylesheet" href="code.css">
        <title>暗号生成キー</title>
    </head>
    <body>
        <header>
            <h1>Takamatsu</h1>
            <button id="home">戻る</button>
        </header>
        <h1>暗号生成</h1>
        <button id="how">使い方</button>
        <dialog id="playPopup">
            <p>使い方</p>
            <p>・暗号に変換する方法</p>
            <span>
                上の枠に暗号化したい文字列を入力します。
                [変換]ボタンを押すと下の枠に暗号化された
                文字列が生成されます。<br>
                10進数、16進数、2進数のボタンがありますが
                基本的に16進数が良いです。
                <br>文字コードはUTF-16を使用しています。
            </span>
            <p>・復元方法</p>
            <span>
                上の枠に復元化したい文字列を入力します。
                [復元]ボタンを押すと下の枠に復号化された
                文字列が生成されます。<br>
                注意：復元化も上の枠を使用すること。
                10進数、16進数、2進数のボタンの形式を合わせること。
                必ず文字の間はスペースであること。
            </span>
            <button id="close">閉じる</button>
        </dialog>
        <textarea name="t"placeholder="ここに文字列を入力してください" id="input"></textarea>
        <div id="format">
            <input type="radio" id="dec" name="choice">
            <label for="dec">10進数</label>
            <input type="radio" id="hex" name="choice" checked>
            <label for="hex">16進数</label>
            <input type="radio" id="bin" name="choice">
            <label for="bin">2進数</label>
        </div>
        <div id="button">
            <button id="encode">変換</button>
            <button id="decode">復元</button>
            <button id="copy">コピー</button>
            <button id="delete">消去</button>
        </div>
        <textarea name="t"placeholder="ここに変換された文字列が出力されます"id="output"></textarea>
        <script src="footer.js"></script>
        <script src="code.js"></script>
    </body>
</html>
