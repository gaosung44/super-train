<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <link rel="icon" href="../image/super_train.png" type="image/png">
        <link rel="stylesheet" href="../style.css">
        <link rel="stylesheet" href="omikuji.css">
        <title>おみくじ</title>
    </head>
    <body>
        <header>
            <h1>Takamatsu</h1>
            <button id="home">戻る</button>
        </header>
        <h1>おみくじ</h1>
        <h2 id="message">引くを押してスタート</h2>
        <img id="result" alt="おみくじ画像"></img>
        <button id="start">引く</button>
        <script src="footer.js"></script>
        <script>
            const msg = document.getElementById("message");
            const img = document.getElementById("result");
            const item = ["大吉","中吉","小吉","吉","末吉","凶","大凶",];
            img.src = "../image/omikuji/none.png";
            let count = 0;
            function play(){
                const R = Math.floor(Math.random()*item.length);
                img.style.visibility = "visible";
                if (count < 10){
                    msg.textContent = item[R];
                    img.src = `../image/omikuji/${R+1}.png`;
                    count++;
                } else {
                    alert("もう引けません");
                }
            }
            document.getElementById("start").addEventListener("click",()=>{
                play();
            });
        </script>
    </body>
</html>
