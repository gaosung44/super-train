<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <link rel="icon" href="image/mini_train.png" type="image/png">
        <link rel="stylesheet" href="style.css">
        <title>Super train</title>
    </head>
    <body>
        <h1>Super train</h1>
        <hr>
        <img src="image/super_train.png" id="img" title="トレイン">
        <p>これはとても素晴らしいです</p>
        <details>
            <summary>Super trainって何?</summary>
            <div id="popup">
                Super trainは訳すと特急列車になります。
                しかしこのサイトは電車のファンサイトやJR関係ではありません。
                このサイトはミニゲームやツールなどを遊ぶことができます。
                ぜひ楽しんでください。
            </div>
        </details>
        <button id="GoToMenu">メニューへ行く⇒</button>
        <script>
            const train = document.getElementById("img");
            const button = document.getElementById("GoToMenu");
            train.addEventListener("click",()=>{
                alert("ハロー");
            });
            button.addEventListener("click",()=>{
                location.href = "menu.html";
            });
        </script>
    </body>
</html>
